name: Casper.exe

on:
  push:
    paths:
      - "casper/**"
      - ".github/workflows/casper-exe.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: casper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıklar
        run: python -m pip install -r requirements.txt pyinstaller pytest
      - name: Testler
        run: python -m pytest -q tests
      - name: Windows parçaları (OCR, pencere, pywebview)
        run: python tests/windows_smoke.py
      - name: Casper.exe derle
        run: python -m PyInstaller --noconfirm --clean Casper.spec
      - name: exe açılıyor mu (10 sn)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Casper.exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            Get-Content "$env:APPDATA\Casper\casper.log" -ErrorAction SilentlyContinue
            throw "Casper.exe hemen kapandı (çıkış kodu $($p.ExitCode))"
          }
          Stop-Process -Id $p.Id -Force
          Get-Content "$env:APPDATA\Casper\casper.log" -ErrorAction SilentlyContinue
          Write-Output "Casper.exe 10 saniye açık kaldı."
      - uses: actions/upload-artifact@v4
        with:
          name: Casper-exe
          path: casper/dist/Casper.exe
          retention-days: 30
