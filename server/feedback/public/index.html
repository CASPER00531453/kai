<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kai Feedback</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0b10; color: #e8eaf0;
         font: 15px/1.6 system-ui, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 460px; text-align: center; }
  .stars { font-size: 34px; color: #ffd666; letter-spacing: 4px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  p { color: #a3a8b8; margin: 6px 0; }
  .ok { display: inline-block; margin-top: 14px; padding: 4px 12px; border-radius: 999px; background: rgba(46,212,122,.12); color: #2ed47a; font-size: 13px; }
</style>
</head>
<body>
<main>
  <div class="stars">★★★★★</div>
  <h1>Kai'nin posta kutusu</h1>
  <p>Kai kullanıcılarının verdiği yıldızlar ve istekler buraya gelir, oradan geliştiricinin Kai'sine not olarak düşer.</p>
  <p>Mesajlar burada gösterilmez; sadece geliştiricinin Kai'si okuyabilir.</p>
  <span class="ok">Sunucu çalışıyor</span>
</main>
</body>
</html>
