<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casper Gözcü</title>
  <style>
    :root { --bg: #0d0f14; --panel: #151922; --line: #2a3142; --text: #e7e9ee; --muted: #8b93a7; --accent: #d9b56b; --bad: #eb5757; color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px "Segoe UI", system-ui, sans-serif; }
    header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: move; }
    .logo { width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #f3dca6, var(--accent) 60%, #8a6a2c); display: grid; place-items: center; color: #1a1408; font-weight: 800; font-size: 13px; }
    header b { flex: 1; }
    #state { color: var(--muted); font-size: 12px; padding: 6px 14px; border-bottom: 1px solid var(--line); }
    #dot { width: 8px; height: 8px; border-radius: 50%; background: #6fcf97; box-shadow: 0 0 8px #6fcf97; }
    #dot.think { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: .3; } }
    button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; }
    #feed { padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow: auto; height: calc(100% - 92px); }
    .item { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; line-height: 1.5; animation: in .3s ease-out; }
    .item.new { border-color: var(--accent); }
    .item.error { border-color: var(--bad); color: #f3b4b4; }
    .meta { color: var(--muted); font-size: 11px; margin-bottom: 4px; }
    .empty { color: var(--muted); text-align: center; padding: 30px 10px; }
    @keyframes in { from { opacity: 0; transform: translateY(-6px); } }
  </style>
</head>
<body>
  <header class="pywebview-drag-region"><div class="logo">C</div><b>Casper izliyor</b><div id="dot"></div><button id="hide" title="Gizle">✕</button></header>
  <div id="state">başlıyor…</div>
  <div id="feed"><div class="empty">Bir WhatsApp, Instagram ya da Discord sohbeti aç; yorumlarım burada belirecek.</div></div>
<script>
  "use strict";
  const feed = document.getElementById("feed");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const time = ts => new Date((ts || Date.now() / 1000) * 1000).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
  function add(html, cls = "") {
    const empty = feed.querySelector(".empty");
    if (empty) empty.remove();
    feed.querySelectorAll(".item.new").forEach(x => x.classList.remove("new"));
    feed.insertAdjacentHTML("afterbegin", `<div class="item ${cls}">${html}</div>`);
    while (feed.children.length > 40) feed.lastElementChild.remove();
  }
  window.casperEvent = ev => {
    const dot = document.getElementById("dot");
    if (ev.type === "comment") {
      dot.classList.remove("think");
      const who = ev.person || ev.title || "";
      add(`<div class="meta">${time(ev.ts)} · ${esc(ev.app)}${who ? " · " + esc(who) : ""}</div>${esc(ev.text).replace(/\n/g, "<br>")}`, "new");
    } else if (ev.type === "thinking") {
      dot.classList.add("think");
    } else if (ev.type === "quiet") {
      dot.classList.remove("think");
    } else if (ev.type === "state") {
      document.getElementById("state").textContent = ev.state;
    } else if (ev.type === "error") {
      dot.classList.remove("think");
      add(`<div class="meta">${time()}</div>${esc(ev.text)}`, "error");
    }
  };
  document.getElementById("hide").onclick = () => window.pywebview && window.pywebview.api.overlay_toggle(false);
</script>
</body>
</html>
